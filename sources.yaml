    update_frequency: unknown
    robots_txt_finding: "未实测（不外提供公开检索界面）。"
    terms_finding: >-
      《JPRO利用規約改定 20251001》：第4条 提供者以「周知や流通・販売促進」为目的
      非独占许諾，范围含让第三方閲覧，但**不含再许諾権**；第5条(4)(1)「その他事業者」
      使用「画像等」在提供者要求时须逐家书面承諾；第5条(4)(2) 不得用于生成式 AI 开发
      或机器学习等信息分析；取次搬入情報不得让社内外第三者利用或开示。
    anti_bot_risk: unknown
    compliance_risk: high
    method: manual_curation
    evidence_urls:
      - "https://jpro2.jpo.or.jp/"
      - "https://openbd.jp/news/20230725.html"
    confidence: medium
    verified_by: research_agent
    status_2026: active
    dev_host_reachability: unverified
    notes: >-
      日本书影元数据的**真正权利源头**。是 NDL 書影API 终止、openBD 上游断供的
      共同原因。本项目不抓取；若未来要合法分发书影，须走 JPO 契约。

