#   display_policy               : 本项目允许的展示方式（写死，前端必须遵守）
#
# 【本项目对评价数据的强制策略】
#   P1. 数据库**不设评论正文列**。正文一律以「外链卡片」呈现。
#   P2. 只存聚合分数、评分人数、评论件数，并**显式记录分数口径**（score_scale）。
#   P3. 不同源的分数**不得直接合并计算**（5分制/10分制/100分制/刻度未验证）。
#   P4. 只要该源条款或 robots 禁止，就不展示其数值，只做链接。
#   P5. 每条评分展示必须带 source_url + retrieved_at。
