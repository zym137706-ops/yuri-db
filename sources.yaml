# =============================================================================
# 字段来源映射（field_source_map）
# =============================================================================
# 用于阶段 2 的 schema 设计与阶段 3 的采集编排：
# 每个字段的「主来源 → 补完来源 → 兜底」优先级。
# 标 [E] 的是「编辑判断」，没有 source_url，必须用 classification_basis 标记。
# =============================================================================

field_source_map:

  title_ja:
    primary: [ja_ndl_search_sru_opensearch, ja_openbd]
    secondary: [ja_yurihime, ja_kadocomi, ja_galette]
    fallback: [ja_ndl_japanmarc_bulk]
  authors:
    primary: [ja_openbd]
    secondary: [ja_yurihime, ja_kadocomi, tw_tongli]
    fallback: [ja_ndl_search_sru_opensearch]
  illustrators:
    primary: [ja_openbd]
    secondary: [ln_hobbyjapan, ln_ichijinsha_data]
    fallback: [ja_ndl_search_sru_opensearch]
  media_type:
    primary: ["[E] 由来源性质判定（ja_serialization=漫画 / ln_label=轻小说 / web_novel=Web小说）"]
  publisher_ja:
    primary: [ja_openbd, ja_ndl_search_sru_opensearch]
    fallback: [ja_ndl_japanmarc_bulk]
  magazine_or_platform:
    primary: [ja_yurihime, ja_galette, ja_kadocomi, ja_web_ace_youngaceup]
    secondary: [wn_narou_api, wn_kakuyomu]
  serialization_status:
    primary: [ja_yurihime, ja_kadocomi, ja_web_ace_youngaceup]
    secondary: [ja_openbd]
    note: "开放数据里没有统一的「连载状态」字段；openBD 只有 ProductAvailability/zaiko/datezeppan，不等于连载状态。"
  start_date:
    primary: [ja_yurihime, ja_kadocomi]
    fallback: [ja_ndl_search_sru_opensearch]
    note: "官方常只公布创刊号；NDL 只有出版年月 → 精确到日的完整率低。"
  end_date:
    primary: [ja_yurihime, an_official_site]
    note: "完结作品才有，须人工从官网/新闻取。"
  chapter_count:
    primary: [ja_web_ace_youngaceup, ja_galette]
    secondary: [ja_kadocomi]
    note: "→ 建议改存 latest_chapter_label（字符串）而非整数。"
  volume_count_ja:
    primary: [ln_ichijinsha_data, ln_hobbyjapan, ln_ga_bunko]
    secondary: [ja_openbd, ja_ndl_search_sru_opensearch]
  volume_count_zh_tw:
    primary: [tw_tongli, tw_chingwin]
    secondary: [tw_ncl_isbn, tw_ncl_bulk]
  volume_count_zh_cn:
    primary: [cn_cppinfo]
    secondary: [cn_tianwen_bilibili]
  genres:
    primary: [wn_kakuyomu, ja_ichicomi]
    secondary: [wn_narou_api]
    note: "仅部分平台有官方百合标签；なろう 无百合ジャンル（靠 is_gl）。"
  yuri_type:
    primary: ["[E] 编辑判断"]
    note: "无官方来源。必须用 classification_basis=editorial 标记，且不得伪造 source_url。"
  anime_status:
    primary: [an_official_site]
    secondary: [an_shobocal, an_anilist, an_mal]
    note: "官方动画站为准；第三方库仅作候选检测。"
  anime_details:
    broadcast_date: [an_official_site, an_shobocal]
    studio: [an_official_site, an_anilist]
    episode_count: [an_shobocal]
  ja_volumes_isbn:
    primary: [ja_ndl_search_sru_opensearch, ja_openbd]
    secondary: [ln_ga_bunko, ln_sqex_novel, ln_hobbyjapan]
    note: "ISBN 是唯一稳定的跨源连接键。"
  ja_volumes_cover_url:
    primary: [ja_openbd]
    note: "openBD 条款禁止再配布 → 默认只存 URL，不镜像。"
  zh_tw_volumes:
    primary: [tw_tongli, tw_chingwin, tw_ncl_isbn]
    secondary: [tw_kadokawa, tw_egmanga]
  official_zh_cn:
    primary: [cn_cppinfo]
    secondary: [cn_tianwen_bilibili, cn_bilibili_manga, cn_kuaikan]
    note: "须区分「实体书（有 ISBN）」与「数字授权（无 ISBN）」。"
  unofficial_zh:
    primary: []
    note: "本项目不采集。一律 unknown + 前端说明文案（见可行性报告 §6.4）。"
  ratings_ja:
    primary: [rv_ja_rakuten, rv_ja_sugoiweb]
    secondary: [rv_ja_anilist, rv_ja_mal_official]
  ratings_zh_tw:
    primary: [rv_tw_bahamut]
    secondary: [rv_tw_kingstone, rv_tw_readmoo]
  ratings_zh_cn:
    primary: []
    note: "不可做。改用外链 + 机构榜单。"
  review_meta:
    primary: [rv_ja_openbd_shohyo]
    note: "只有书评刊登元数据（报刊名/评者/日期/链接），无正文。"

