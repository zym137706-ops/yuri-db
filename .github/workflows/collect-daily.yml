# =============================================================================
# 每日增量采集
# =============================================================================
# 阶段 5 交付物。
#
# 为什么跑在 GitHub Actions：
#   阶段 1 实测本机出网被污染/阻断（DNS 解析到无关 IP、TCP 21s 超时、WAF），
#   无法承担采集。GH Actions runner 的出网不受此限制。
#   见 docs/phase1-feasibility-report.md §2。
#
# 合规护栏：
#   - 采集器内置 robots.txt 门禁、per-host 限速、可识别 UA
#   - 网络失败与 robots 拒绝分开记录，不互相污染
#   - 原始响应留档（artifact），标准化层另存
# =============================================================================
name: collect-daily

on:
  schedule:
    # 01:00 UTC = 10:00 JST。日本出版社官网新刊信息多在上午更新。
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      details:
        description: "東立 detail ページを取得する件数"
        required: false
        default: "24"

permissions:
  contents: write

concurrency:
  group: collect-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python deps
        run: pip install --quiet requests lxml pyyaml jsonschema python-dateutil

      - name: Collect works (robots-gated, rate limited)
        run: |
          python collectors/run.py \
            --delay 2.0 \
            --details ${{ github.event.inputs.details || '24' }}

      - name: Collect anime status (AniList GraphQL)
        run: python collectors/anime.py --pages 6 --sleep 2.5
        continue-on-error: true

      - name: Collect yuri manga + light novel catalogue (AniList)
        run: python collectors/anilist_works.py --pages 12 --sleep 3.0
        continue-on-error: true

      - name: Enrich publisher / 文庫 / レーベル (NDL, batched)
        # NDL 禁止并发且会 429/读超时，因此每天只补一批（--limit），
        # 输出为合并式写入，覆盖度会逐日上升。
        run: python scripts/enrich_works_from_ndl.py --limit 200 --delay 2.5 --retries 1
        continue-on-error: true

      - name: Collect Japanese ISBNs (NDL Search)
        # NDL rate-limits hard (429) and this run is already long; the retry/
        # backoff inside ndl.py handles it. Partial progress is still useful.
        run: python collectors/ndl.py --limit 60 --delay 3.5
        continue-on-error: true

      - name: Build normalised dataset + validate against schema
        run: python scripts/build_dataset.py

      # 提交前必须校验。2026-10-12 的事故正是这样发生的：anilist_works.py 一轮
      # 全部失败把 820 条写成 0 条 -> build_dataset 只生成 35 部作品 ->
      # 这步缺失，于是坏数据被 commit 并部署上线，而整条流水线是绿的。
      # 现在只要验收硬门禁不过，作业就失败，坏数据不会被提交。
      - name: Acceptance gates (refuse to commit a collapsed dataset)
        run: python scripts/verify_acceptance.py

      - name: Generate change log (diff vs previous commit)
        run: python scripts/make_changelog.py

      - name: Compliance self-check (no piracy domains)
        run: python research/compliance_check.py

      - name: Upload raw responses (evidence / reproducibility)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-fetch-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload run stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-stats-${{ github.run_id }}
          path: data/run_stats.json
          retention-days: 90
          if-no-files-found: warn

      - name: Commit updated dataset
        run: |
          git config user.name  "yuri-db bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/works.json data/dataset_report.json data/change_log.json data/raw_records.json data/run_stats.json data/anime_status.json data/ndl_volumes.json data/anilist_works.json data/ndl_enrichment.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): daily collect $(date -u +%Y-%m-%d)"
            git push
          fi
