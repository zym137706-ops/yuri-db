# =============================================================================
# 日本百合漫画 / 轻小说 连载与出版信息数据库 —— 数据源清单
# =============================================================================
# 阶段 1 交付物 · sources.yaml
# 版本        : 0.1.0-draft
# 生成日期    : 2026-10-09
# 时区        : Asia/Hong_Kong
# 维护者      : 待定（项目 owner）
#
# 本文件描述「候选数据源」，不包含任何采集到的作品数据。
# 每条数据源都标注了：可获取字段、认证要求、更新频率、robots.txt 实测结果、
# 条款风险、反爬风险、建议采集方式、证据链接、可信度、2026 年现状。
#
# -----------------------------------------------------------------------------
# 可信度与证据等级（confidence / verified_by）
# -----------------------------------------------------------------------------
# confidence:
#   high   = 有官方一手文档或实测响应体作为证据
#   medium = 有可靠的二手资料或多方一致的说法，但未取得一手证据
#   low    = 仅来自搜索结果片段或无法访问，需要人工复核
#
# verified_by:
#   lead_direct    = 本项目 Lead 在本次调研中直接访问/实测取得（最强证据）
#   research_agent = 调研子代理联网查证后报告，附有 evidence_urls
#   search_only    = 仅来自搜索结果，未打开原文
#
# -----------------------------------------------------------------------------
# 环境事实（**已修正**，2026-10-09 第二轮）
# -----------------------------------------------------------------------------
# 【修正说明】本文件初版把多个域名标为「本机不可达」。该结论是错的：
# 当时主要用 curl 与 node 测连通性，而**本机的 curl(schannel) 与 node TLS 栈是坏的**，
# 于是把「客户端握手失败」误判成「网络阻断」。改用与采集器一致的
# **Python requests** 复测后，绝大多数域名其实可达，并且阶段 3 已在本机
# 实际完成了 東立 / 百合姫 / ガレット / AniList / NDL 的采集。
#
# 修正后的真实情况：
#   ✅ 可达（改用 requests 后）：ndlsearch.ndl.go.jp（慢但成功取回数据）、
#      app.rakuten.co.jp（401 = 真实 API 鉴权拒绝）、www.googleapis.com
#      （429 = 真实配额耗尽）、api.calil.jp（200）、isbn.ncl.edu.tw（404 = 无 robots）、
#      www.books.com.tw（200）、cal.syoboi.jp（200）、graphql.anilist.co（POST 200）、
#      ga.sbcr.jp、comic-action.com、prtimes.jp 等
#   ❌ 确实被劫持/不可达：api.syosetu.com（DNS 指向无关 IP，返回非なろう 的 403）、
#      www.pixiv.net、api.jikan.moe（超时）
#   ⛔ 站点主动拒绝：natalie.mu（robots.txt 405 + AWS WAF）、
#      www.alphapolis.co.jp（202 空响应 + WAF）
#
# 因此：**不要把单次超时或单一客户端的失败当作站点策略。**
# 本文件中的 reachable_from_dev_host 已按上述结论标注，但仍以「用生产客户端复现」
# 为准。云端 CI 仍推荐（定时与稳定），但不再是「本机做不到」的替代。
#
# dev_host_reachability: verified_reachable | verified_unreachable | unverified
#   初版用了坏掉的 curl/node TLS 客户端，导致大量 false 误判（见文件头修正说明）。
#   本轮只复测了一部分；**未复测一律记 unverified，而不是留一个假阴性**。
# -----------------------------------------------------------------------------
# 全局合规红线（所有采集器必须遵守）
# -----------------------------------------------------------------------------
# R1. 不访问、不索引、不存储任何盗版站 / 漫画聚合站 / 汉化组发布页的内容与链接。
# R2. 不绕过付费墙、登录墙、验证码或 AWS WAF 挑战。遇到即跳过并记录。
# R3. 尊重 robots.txt。UA 必须带可识别标识与联系 URL。
# R4. 不存储评论正文全文（第三方著作权）。评价只存聚合分数与件数 + 原文链接。
# R5. 书影（封面图）默认**不镜像**，只存原始 URL 或本地缓存后即时清理；
#     openBD 条款（本文件 ja_openbd）明确禁止向第三方再配布。
# R6. 无法确认的字段一律写 "unknown"，不得推测填充。
# R7. openBD 等按「书籍介绍目的」授权得到的字段，不对外提供批量数据转储。
# =============================================================================

meta:
  version: "0.1.0-draft"
  generated_at: "2026-10-09"
  timezone: "Asia/Hong_Kong"
  scope: "phase1_source_survey"
  robot_policy: "respect_robots_txt"
  default_user_agent: "YuriDBBot/0.1 (+https://example.org/yuri-db/bot; contact: TODO)"
  crawl_delay_default_seconds: 2
  licensing_note: >-
    本清单只登记「合法公开来源」。任何盗版、汉化发布、在线盗版阅读站点均不在
    调研与采集范围内，也不得写入本文件。

# -----------------------------------------------------------------------------
# 采集方式枚举（method 字段取值）
#   official_api    : 官方 API，首选
#   bulk_download   : 官方提供的批量文件下载（ZIP/MARC/TSV）
#   sitemap_crawl   : 依官方 sitemap 枚举 URL 后低频抓取页面
#   html_crawl      : 低频 HTML 抓取（无 sitemap 时）
#   rss             : 官方 RSS/Atom
#   manual_curation : 人工核对录入（无可用自动源时）
#   do_not_collect  : 明确不建议采集（条款/技术限制）
# -----------------------------------------------------------------------------

sources:

  # ===========================================================================
  # A. 日本书目 / ISBN / 书影 元数据
  # ===========================================================================

  - id: ja_ndl_search_sru_opensearch
    name: "国立国会図書館サーチ 検索用API（SRU / OpenSearch / OpenURL）"
    name_ja: "NDLサーチ 外部提供インタフェース"
    url: "https://ndlsearch.ndl.go.jp/help/api/specifications"
    category: ja_bibliography
    source_type: official_api
    api_endpoint: >-
      https://ndlsearch.ndl.go.jp/api/sru?operation=searchRetrieve&query=...
      / https://ndlsearch.ndl.go.jp/api/opensearch?...
      / https://ndlsearch.ndl.go.jp/api/opensearch_description
    auth_requirement: none
    fields_available:
      - ISBN
      - title / titleTranscription
      - creator (著者)
      - publisher / publicationPlace
      - date (出版年月)
      - NDC / NDLC / LCC / DDC / UDC
      - subject
      - jpno (全国書誌番号)
      - ISSN / price / extent
      - NDLBibID / mediaType / dpid
    limits: >-
      SRU maximumRecords 上限 500（默认 200）；OpenSearch cnt 上限 500（默认 200），
      且 idx+cnt 指定 501 件以后无法取得。禁止多并发；官方不公布并发上限但保留遮断权利。
    update_frequency: "准实时（2026-09-25〜27 因データ全件入替作业受影响）"
    robots_txt_finding: "实测 200：Disallow /account /favorite /search/history 等个人化页面，以及 /api 与 /statistics 給通用爬虫。"
    terms_finding: >-
      NDL 自建書誌データ（含全国書誌）営利・非営利を問わず無償，需出典表示，
      加工时另标「加工して作成」。第三方数据提供机构的 metadata 需逐库看条件。
    anti_bot_risk: low
    compliance_risk: medium
    method: official_api
    evidence_urls:
      - "https://ndlsearch.ndl.go.jp/help/api/specifications"
      - "https://ndlsearch.ndl.go.jp/robots.txt"
      - "https://ndlsearch.ndl.go.jp/api/opensearch_description"
    confidence: medium
    verified_by: research_agent
    status_2026: active
    dev_host_reachability: verified_reachable
    notes: >-
      【本地不可达】实测 ndlsearch.ndl.go.jp:443 连接超时，须改用云端 CI 采集。
      规格书 PDF 附有改版履历（第1.4版 2026-03-31、第1.5版 2026-09-25），证明在持续维护。
      重要：書影API 已于 2026-03-31 服务終了（见 ja_ndl_thumbnail_terminated）。

  - id: ja_ndl_search_oaipmh
    name: "NDLサーチ ハーベスト用API（OAI-PMH）"
    url: "https://ndlsearch.ndl.go.jp/help/api/specifications"
    category: ja_bibliography
    source_type: official_api
    api_endpoint: "https://ndlsearch.ndl.go.jp/api/oaipmh?verb=Identify|ListRecords|GetRecord|..."
    auth_requirement: none
    fields_available:
      - "metadataPrefix=oai_dc / dcndl / dcndl_v3"
      - "identifier=oai:ndlsearch.ndl.go.jp:[リポジトリ番号]-[アイテム番号]"
      - "set (dpid / データグループID / Access Rights)"
      - "from / until (JST)"
      - "deletedRecord=persistent"
    limits: >-
      ListRecords / ListIdentifiers 一次最多 200 件，用 resumptionToken 翻页；
      from 必填且 from–until 期间不得超过 1 年。
    update_frequency: "准实时差分（earliestDatestamp=2022-10-01T00:00:00Z）"
    robots_txt_finding: "同 ndlsearch 域：/api 对通用爬虫 Disallow，但官方 API 走「利用申請」制度，不算冲突。"
    terms_finding: "同 NDL 書誌データ条件：無償、需出典表示。"
    anti_bot_risk: low
    compliance_risk: medium
    method: bulk_download
    evidence_urls:
      - "https://ndlsearch.ndl.go.jp/api/oaipmh?verb=Identify"
      - "https://ndlsearch.ndl.go.jp/help/api/specifications"
    confidence: medium
    verified_by: research_agent
    status_2026: active
    dev_host_reachability: verified_reachable
    notes: >-
      【本地不可达】建议作为**全量采集主通道**（走云端 CI）。
      坑：OAI-PMH 返回的是「同定处理前」的各提供方原始元数据，与 SRU/OpenSearch
      的「同定后」口径不同，去重时必须意识到这是两套记录。

  - id: ja_ndl_japanmarc_bulk
    name: "国立国会図書館 全国書誌 / JAPAN/MARC 一括ダウンロード"
    url: "https://www.ndl.go.jp/en/data/data_service/quickguide"
    category: ja_bibliography
    source_type: official_website
    api_endpoint: "无 API，为文件下载：JAPAN/MARC 週次 ZIP / 全国書誌（電子書籍編）週次 TSV ZIP"
    auth_requirement: none
    fields_available:
      - MARC21 / JAPAN/MARC (ISO 2709)
      - MARCXML / MARCタグ形式
      - TSV / JSON / BibTeX / DC-NDL(RDF)
      - 全国書誌番号 (JPNO)
      - ISBN / NDC / NDLC
      - 典拠データ (Web NDL Authorities)
    update_frequency: "JAPAN/MARC 週次（全件为年4回：3/6/9/12月）；電子書籍編 TSV 每週二更新"
    robots_txt_finding: "下载页为普通公开页面，未见访问限制说明（本次未单独取 www.ndl.go.jp/robots.txt）。"
    terms_finding: >-
      条款为全组最优：NDL 自建書誌・典拠・雑誌記事索引データ「営利・非営利の目的を
      問わず、どなたでも無償で利用」，只需出典表示。
    anti_bot_risk: low
    compliance_risk: low
    method: bulk_download
    evidence_urls:
      - "https://www.ndl.go.jp/en/data/data_service/quickguide"
      - "https://www.ndl.go.jp/jp/data/data_service/index.html"
    confidence: medium
    verified_by: research_agent
    status_2026: active
    dev_host_reachability: unverified
    notes: >-
      规模：JAPAN/MARC(M/S) 全件约 4.27GB（分3文件）、JAPAN/MARC(A) 约 301MB；
      全件需通过 NDL 咨询表单申请。注意 TSV/JSON/BibTeX 是簡略数据（会缺字段），
      完整書誌须用 MARC 系。

  - id: ja_openbd
    name: "openBD（版元ドットコム × カーリル）書誌・書影API"
    url: "https://openbd.jp/"
    category: ja_bibliography
    source_type: official_api
    api_endpoint: "https://api.openbd.jp/v1/get?isbn=ISBN[,ISBN...] / /v1/coverage / /v1/schema"
    auth_requirement: none
    fields_available:
      - ISBN
      - 書名 / サブタイトル
      - シリーズ・レーベル名
      - 著者 (Contributor)
      - 出版社 (Imprint / Publisher)
      - 発売予定日 (PublishingDate)
      - 内容紹介 / 目次 (TextContent)
      - 書影 URL (最大3枚)
      - 判型実寸 / ページ数
      - "hanmoto: lanove（ライトノベルフラグ）"
      - "hanmoto: reviews（書評情報）"
      - "hanmoto: ndccode / zaiko / datezeppan / jyuhan"
    update_frequency: "不定（实测 datemodified 反映近期更新）"
    robots_txt_finding: "https://openbd.jp/robots.txt 返回 404（未设置，无 Disallow 规则）。"
    terms_finding: >-
      【重要·已读全文】2017-03-09 制定。①数据「本の販促・紹介目的に限り」可用，
      个人/团体/企业均可、无偿；②**禁止将取得的信息「第三者に貸与、譲渡、売買」**，
      即禁止再配布/转售；③**不得任意改変**；④项目方要求删除时必须迅速响应；
      ⑤缓存时必须尽快反映变更。
    anti_bot_risk: low
    compliance_risk: medium
    method: official_api
    evidence_urls:
      - "https://openbd.jp/terms/"
      - "https://openbd.jp/spec/"
      - "https://openbd.jp/news/20230725.html"
    confidence: high
    verified_by: lead_direct
    status_2026: active
    dev_host_reachability: verified_reachable
    notes: >-
      【本机可访问但偏慢】实测 /v1/get 返回 302→200 有数据；/terms/、/spec/ 已直接读取全文。
      上游重大变化：2023-06-05 起 JPRO 停止向版元ドットコム配信，非会員社数据停更；
      2023-08-29 起以 NDL 的 CC-BY 書誌为基础提供「代替書誌情報」，规格不变但
      収録範囲・内容大幅变化，**書影収録範囲大幅下降**。
      因此当前 openBD ≈ 版元ドットコム会員社 + NDL 替代書誌，命中率需逐 ISBN 实测。
      /coverage 返回全量 ISBN 列表，响应体极大（实测超时），须流式处理。
      【合规】因条款②，本项目**不得**对外提供 openBD 派生字段的批量数据转储。

