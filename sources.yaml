  - id: ja_calil_api
    name: "カーリル 図書館API（Calil Library API）"
    url: "https://calil.jp/doc/api.html"
    category: library
    source_type: official_api
    api_endpoint: "https://api.calil.jp/library?appkey=... / https://api.calil.jp/check?appkey=...&isbn=...&systemid=..."
    auth_requirement: free_api_key
    fields_available:
